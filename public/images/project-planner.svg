<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="plannerTitle">
  <title id="plannerTitle">Campus Course Planner interface with a weekly timetable</title>
  <defs>
