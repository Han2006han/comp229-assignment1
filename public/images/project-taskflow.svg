<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="taskflowTitle">
  <title id="taskflowTitle">TaskFlow kanban board with To Do, In Progress and Done columns</title>
  <defs>
    <linearGradient id="taskBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f2ff"/>
      <stop offset="100%" stop-color="#fbfaff"/>
    </linearGradient>
    <filter id="taskShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2b2b5e" flood-opacity="0.14"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2b2b5e" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#taskBg)"/>
  <circle cx="1080" cy="720" r="170" fill="#8b5cf6" opacity="0.09"/>
  <circle cx="120" cy="90" r="150" fill="#5b5bd6" opacity="0.08"/>

  <g filter="url(#taskShadow)">
    <rect x="60" y="50" width="1080" height="700" rx="26" fill="#ffffff"/>
  </g>

  <!-- App header -->
  <path d="M60 76a26 26 0 0 1 26-26h1028a26 26 0 0 1 26 26v44H60Z" fill="#fbfbfe"/>
  <line x1="60" y1="120" x2="1140" y2="120" stroke="#edecf6"/>
  <rect x="92" y="68" width="28" height="28" rx="8" fill="#5b5bd6"/>
  <path d="M100 78h12M100 84h12M100 90h7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="132" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#141428">TaskFlow</text>
  <rect x="430" y="66" width="330" height="32" rx="16" fill="#f1f1f8"/>
  <circle cx="452" cy="82" r="5" fill="none" stroke="#a3a3b8" stroke-width="1.6"/>
  <line x1="456" y1="86" x2="460" y2="90" stroke="#a3a3b8" stroke-width="1.6" stroke-linecap="round"/>
  <text x="472" y="87" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a3a3b8">Search tasks</text>

  <circle cx="1010" cy="82" r="15" fill="#c7d2fe"/>
  <text x="1010" y="87" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#4338ca">HL</text>
  <circle cx="1050" cy="82" r="15" fill="#ddd6fe"/>
  <text x="1050" y="87" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#6d28d9">MK</text>
  <rect x="1080" y="66" width="32" height="32" rx="10" fill="#5b5bd6"/>
  <path d="M1096 74v16M1088 82h16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Board heading -->
  <text x="100" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#141428">Sprint 14 board</text>
  <text x="100" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#8a8aa3">3 of 9 tasks complete · due Friday</text>
  <rect x="980" y="150" width="120" height="34" rx="17" fill="#f1f1f8"/>
  <text x="1040" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5d5d78">Filter</text>

  <!-- Column: To do -->
  <rect x="100" y="212" width="316" height="490" rx="18" fill="#f8f7fe"/>
  <circle cx="124" cy="242" r="5" fill="#a3a3b8"/>
  <text x="138" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#4b4b63">To do</text>
  <text x="392" y="247" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a3a3b8">4</text>

  <g filter="url(#cardShadow)">
    <rect x="116" y="266" width="284" height="104" rx="12" fill="#ffffff"/>
    <rect x="116" y="382" width="284" height="104" rx="12" fill="#ffffff"/>
    <rect x="116" y="498" width="284" height="104" rx="12" fill="#ffffff"/>
  </g>

  <!-- Card 1: bug -->
  <rect x="132" y="282" width="62" height="20" rx="10" fill="#fee2e2"/>
  <text x="163" y="296" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">BUG</text>
  <text x="132" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f1f38">Fix mobile nav overflow</text>
  <text x="132" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8a8aa3">Card · 2 comments</text>
  <circle cx="378" cy="318" r="11" fill="#ddd6fe"/>
  <text x="378" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#6d28d9">MK</text>

  <!-- Card 2: design -->
  <rect x="132" y="398" width="70" height="20" rx="10" fill="#e0f2fe"/>
  <text x="167" y="412" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#0369a1">DESIGN</text>
  <text x="132" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f1f38">Empty state illustrations</text>
  <text x="132" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8a8aa3">Assets · 1 attachment</text>
  <circle cx="378" cy="434" r="11" fill="#c7d2fe"/>
  <text x="378" y="438" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#4338ca">HL</text>

  <!-- Card 3: docs -->
  <rect x="132" y="514" width="54" height="20" rx="10" fill="#fef3c7"/>
  <text x="159" y="528" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#92400e">DOCS</text>
  <text x="132" y="554" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f1f38">Write keyboard shortcut guide</text>
  <text x="132" y="576" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8a8aa3">Docs · due Thursday</text>

  <!-- Column: In progress -->
  <rect x="442" y="212" width="316" height="490" rx="18" fill="#f8f7fe"/>
  <circle cx="466" cy="242" r="5" fill="#8b5cf6"/>
  <text x="480" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#4b4b63">In progress</text>
  <text x="734" y="247" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a3a3b8">2</text>

  <g filter="url(#cardShadow)">
    <rect x="458" y="266" width="284" height="120" rx="12" fill="#ffffff"/>
    <rect x="458" y="402" width="284" height="120" rx="12" fill="#ffffff"/>
  </g>

  <rect x="474" y="282" width="72" height="20" rx="10" fill="#ede9fe"/>
  <text x="510" y="296" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#5b21b6">FEATURE</text>
  <text x="474" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f1f38">Drag and drop between columns</text>
  <text x="474" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8a8aa3">2 of 3 subtasks done</text>
  <rect x="474" y="356" width="252" height="6" rx="3" fill="#eeecf9"/>
  <rect x="474" y="356" width="168" height="6" rx="3" fill="#8b5cf6"/>
  <circle cx="720" cy="334" r="11" fill="#ddd6fe"/>
  <text x="720" y="338" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#6d28d9">HL</text>

  <rect x="474" y="418" width="66" height="20" rx="10" fill="#dcfce7"/>
  <text x="507" y="432" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#166534">A11Y</text>
  <text x="474" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f1f38">Keyboard move for cards</text>
  <text x="474" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8a8aa3">Focus ring review pending</text>
  <rect x="474" y="492" width="252" height="6" rx="3" fill="#eeecf9"/>
  <rect x="474" y="492" width="84" height="6" rx="3" fill="#8b5cf6"/>

  <!-- Column: Done -->
  <rect x="784" y="212" width="316" height="490" rx="18" fill="#f8f7fe"/>
  <circle cx="808" cy="242" r="5" fill="#10b981"/>
  <text x="822" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#4b4b63">Done</text>
  <text x="1076" y="247" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a3a3b8">3</text>

  <g filter="url(#cardShadow)">
    <rect x="800" y="266" width="284" height="86" rx="12" fill="#ffffff"/>
    <rect x="800" y="368" width="284" height="86" rx="12" fill="#ffffff"/>
    <rect x="800" y="470" width="284" height="86" rx="12" fill="#ffffff"/>
  </g>

  <path d="M818 296l6 6 12-12" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="848" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#4b4b63">Set up localStorage sync</text>
  <text x="848" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a3a3b8">Closed yesterday</text>

  <path d="M818 398l6 6 12-12" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="848" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#4b4b63">Design empty board state</text>
  <text x="848" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a3a3b8">Closed 2 days ago</text>

  <path d="M818 500l6 6 12-12" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="848" y="506" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#4b4b63">Add task creation form</text>
  <text x="848" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a3a3b8">Closed last week</text>
</svg>
