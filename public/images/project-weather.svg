<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="weatherTitle">
  <title id="weatherTitle">Weather dashboard showing current conditions and a seven day forecast chart</title>
  <defs>
    <linearGradient id="weatherBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="100%" stop-color="#f5f8ff"/>
    </linearGradient>
    <linearGradient id="skyCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f6fed"/>
      <stop offset="100%" stop-color="#7c5cf0"/>
    </linearGradient>
    <linearGradient id="chartArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b5bd6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#5b5bd6" stop-opacity="0"/>
    </linearGradient>
    <filter id="weatherShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e3a8a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#weatherBg)"/>
  <circle cx="1060" cy="120" r="150" fill="#38bdf8" opacity="0.12"/>
  <circle cx="140" cy="720" r="170" fill="#8b5cf6" opacity="0.08"/>

  <g filter="url(#weatherShadow)">
    <rect x="60" y="50" width="1080" height="700" rx="26" fill="#ffffff"/>
  </g>

  <!-- App header -->
  <text x="100" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#141428">Skyline</text>
  <text x="176" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a3a3b8">weather dashboard</text>
  <rect x="900" y="78" width="196" height="34" rx="17" fill="#f1f1f8"/>
  <circle cx="922" cy="95" r="5" fill="none" stroke="#a3a3b8" stroke-width="1.6"/>
  <line x1="926" y1="99" x2="930" y2="103" stroke="#a3a3b8" stroke-width="1.6" stroke-linecap="round"/>
  <text x="940" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a3a3b8">Toronto, ON</text>

  <!-- Current conditions card -->
  <rect x="92" y="136" width="372" height="286" rx="22" fill="url(#skyCard)"/>
  <circle cx="398" cy="196" r="46" fill="#fbbf24" opacity="0.9"/>
  <ellipse cx="356" cy="230" rx="58" ry="30" fill="#ffffff" opacity="0.92"/>
  <ellipse cx="304" cy="240" rx="42" ry="24" fill="#ffffff" opacity="0.8"/>
  <text x="124" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#dbeafe">Toronto, ON</text>
  <text x="124" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">18&#176;</text>
  <text x="124" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e0e7ff">Partly cloudy</text>
  <text x="124" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#c7d2fe">Feels like 16&#176; · H 21&#176; L 12&#176;</text>
  <line x1="124" y1="336" x2="432" y2="336" stroke="#ffffff" stroke-opacity="0.22"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#c7d2fe">
    <text x="124" y="364">Wind 14 km/h</text>
    <text x="230" y="364">Humidity 62%</text>
    <text x="336" y="364">UV 3</text>
    <text x="124" y="392">Sunrise 07:12</text>
    <text x="230" y="392">Sunset 17:48</text>
  </g>

  <!-- Seven day chart -->
  <text x="500" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#141428">7-day temperature</text>
  <text x="500" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a3a3b8">High and low, degrees Celsius</text>

  <g stroke="#f0eff8">
    <line x1="500" y1="228" x2="1108" y2="228"/>
    <line x1="500" y1="278" x2="1108" y2="278"/>
    <line x1="500" y1="328" x2="1108" y2="328"/>
    <line x1="500" y1="378" x2="1108" y2="378"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#b6b6c9" text-anchor="end">
    <text x="488" y="232">24&#176;</text>
    <text x="488" y="282">18&#176;</text>
    <text x="488" y="332">12&#176;</text>
    <text x="488" y="382">6&#176;</text>
  </g>

  <!-- Highs area and line -->
  <path d="M516 300 L602 264 L688 246 L774 276 L860 292 L946 262 L1032 236 L1100 250 L1100 402 L516 402 Z" fill="url(#chartArea)"/>
  <polyline points="516,300 602,264 688,246 774,276 860,292 946,262 1032,236 1100,250"
            fill="none" stroke="#5b5bd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="516,352 602,336 688,320 774,344 860,358 946,332 1032,314 1100,322"
            fill="none" stroke="#a5b4fc" stroke-width="2.4" stroke-dasharray="6 6" stroke-linecap="round"/>
  <g fill="#5b5bd6">
    <circle cx="516" cy="300" r="4.5"/>
    <circle cx="602" cy="264" r="4.5"/>
    <circle cx="688" cy="246" r="4.5"/>
    <circle cx="774" cy="276" r="4.5"/>
    <circle cx="860" cy="292" r="4.5"/>
    <circle cx="946" cy="262" r="4.5"/>
    <circle cx="1032" cy="236" r="5.5"/>
    <circle cx="1100" cy="250" r="4.5"/>
  </g>

  <!-- Day labels -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#8a8aa3" text-anchor="middle">
    <text x="516" y="406">Mon</text>
    <text x="602" y="406">Tue</text>
    <text x="688" y="406">Wed</text>
    <text x="774" y="406">Thu</text>
    <text x="860" y="406">Fri</text>
    <text x="946" y="406">Sat</text>
    <text x="1032" y="406">Sun</text>
  </g>

  <!-- Daily cards -->
  <g>
    <rect x="92" y="456" width="128" height="126" rx="16" fill="#f8f8fd"/>
    <text x="156" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#5d5d78">Today</text>
    <circle cx="156" cy="514" r="13" fill="#fbbf24"/>
    <text x="156" y="552" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#141428">18&#176;</text>
    <text x="156" y="570" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a3a3b8">Clear</text>

    <rect x="236" y="456" width="128" height="126" rx="16" fill="#f8f8fd"/>
    <text x="300" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#5d5d78">Tue</text>
    <ellipse cx="300" cy="516" rx="16" ry="9" fill="#cbd5e1"/>
    <text x="300" y="552" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#141428">21&#176;</text>
    <text x="300" y="570" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a3a3b8">Cloudy</text>

    <rect x="380" y="456" width="128" height="126" rx="16" fill="#f8f8fd"/>
    <text x="444" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#5d5d78">Wed</text>
    <path d="M436 522a8 8 0 0 1 4-15 11 11 0 0 1 21 3 7 7 0 0 1-2 12Z" fill="#94a3b8"/>
    <text x="444" y="552" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#141428">16&#176;</text>
    <text x="444" y="570" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a3a3b8">Rain 60%</text>

    <rect x="524" y="456" width="128" height="126" rx="16" fill="#f8f8fd"/>
    <text x="588" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#5d5d78">Thu</text>
    <circle cx="588" cy="512" r="12" fill="#fbbf24"/>
    <text x="588" y="552" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#141428">19&#176;</text>
    <text x="588" y="570" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a3a3b8">Sunny</text>

    <rect x="668" y="456" width="128" height="126" rx="16" fill="#f8f8fd"/>
    <text x="732" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#5d5d78">Fri</text>
    <ellipse cx="732" cy="516" rx="16" ry="9" fill="#cbd5e1"/>
    <text x="732" y="552" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#141428">17&#176;</text>
    <text x="732" y="570" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a3a3b8">Cloudy</text>
  </g>

  <!-- Footer note -->
  <text x="836" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a3a3b8">Cached for 10 minutes</text>
  <text x="836" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a3a3b8">Last updated 09:41</text>
  <rect x="836" y="536" width="272" height="46" rx="14" fill="#eef2ff"/>
  <text x="856" y="564" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#4338ca">Unit: Celsius · Metric</text>
</svg>
